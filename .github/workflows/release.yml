name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: wails-vue-starter-linux-amd64.tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: wails-vue-starter-windows-amd64.zip
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: wails-vue-starter-darwin-arm64.zip
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: wails-vue-starter-darwin-amd64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file pkg-config rpm wget libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Windows packaging dependencies
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (!(Test-Path "$nsisPath\makensis.exe")) {
            $nsisPath = "${env:ProgramFiles}\NSIS"
          }
          if (!(Test-Path "$nsisPath\makensis.exe")) {
            throw "makensis.exe was not found after installing NSIS"
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Task
        shell: bash
        run: go install github.com/go-task/task/v3/cmd/task@v3.45.4

      - name: Install Wails CLI
        shell: bash
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"

      - name: Build macOS app
        if: matrix.goos == 'darwin'
        shell: bash
        run: wails3 task darwin:package ARCH=${{ matrix.goarch }}

      - name: Build Linux binary
        if: matrix.goos == 'linux'
        shell: bash
        run: wails3 task linux:build ARCH=${{ matrix.goarch }}

      - name: Build Windows binary
        if: matrix.goos == 'windows'
        shell: bash
        run: wails3 task windows:build ARCH=${{ matrix.goarch }}

      - name: Package macOS artifact
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "bin/wails-vue-starter.app" "dist/${{ matrix.artifact }}"
          hdiutil create \
            -volname "Wails Vue Starter" \
            -srcfolder "bin/wails-vue-starter.app" \
            -ov \
            -format UDZO \
            "dist/wails-vue-starter-darwin-${{ matrix.goarch }}.dmg"

      - name: Package Linux artifact
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact }}" -C bin wails-vue-starter
          wails3 task linux:create:appimage ARCH=${{ matrix.goarch }}
          wails3 task linux:create:deb ARCH=${{ matrix.goarch }}
          wails3 task linux:create:rpm ARCH=${{ matrix.goarch }}
          find bin -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;

      - name: Package Windows artifact
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Get-Command makensis
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path bin/wails-vue-starter.exe -DestinationPath "dist/${{ matrix.artifact }}" -Force
          wails3 task windows:package ARCH=${{ matrix.goarch }} INSTALL_SCOPE=user
          Copy-Item "bin/wails-vue-starter-${{ matrix.goarch }}-installer.exe" "dist/wails-vue-starter-windows-${{ matrix.goarch }}-installer.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: release-assets/*
          generate_release_notes: true
